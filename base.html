<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Parking</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3 mb-4">
  <a class="navbar-brand" href="{{ url_for('home') }}">Smart Parking</a>
  {% if session.uid %}
  <div class="d-flex gap-2">
    <a class="btn btn-sm btn-outline-light" href="{{ url_for('search') }}">Search</a>
    <a class="btn btn-sm btn-outline-light" href="{{ url_for('dash') }}">Dashboard</a>
    {% if session.admin %}<a class="btn btn-sm btn-outline-warning" href="{{ url_for('admin') }}">Admin</a>{% endif %}
    <a class="btn btn-sm btn-danger" href="{{ url_for('logout') }}">Logout</a>
  </div>
  {% endif %}
</nav>
<main class="container">
  {% for m in get_flashed_messages() %}
    <div class="alert alert-info py-2">{{ m }}</div>
  {% endfor %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
